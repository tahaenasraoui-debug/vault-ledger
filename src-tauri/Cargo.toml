[package]
name = "vault-ledger"
version = "1.0.0"
description = "Air-gapped financial document extraction and double-entry ledger engine"
authors = ["Mohamed Taha Enasraoui"]
edition = "2021"
rust-version = "1.79"

[lib]
name = "vault_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
schemars = { version = "0.8.21", features = ["derive"] }
thiserror = "1.0.64"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "sync", "fs", "macros"] }
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
sha2 = "0.10.8"
hex = "0.4.3"
csv = "1.3.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
lopdf = "0.34.0"
image = { version = "0.25.2", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
ocrs = "0.9.0"
rten = "0.13.1"
candle-core = "0.7.2"
candle-transformers = "0.7.2"
tokenizers = { version = "0.20.0", default-features = false, features = ["fancy-regex"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
metal = ["candle-core/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-transformers/cuda"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
